name: DEBUG temporal - diagnostico CORS/login

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: OPTIONS preflight a /auth/login
        run: |
          curl -sS -i -X OPTIONS https://marcados-app.onrender.com/auth/login \
            -H "Origin: https://miguelbruges.github.io" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            --max-time 30 || true

      - name: POST real a /auth/login (credenciales inventadas, solo para ver el status)
        run: |
          echo "---"
          curl -sS -i -X POST https://marcados-app.onrender.com/auth/login \
            -H "Origin: https://miguelbruges.github.io" \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"loquesea"}' \
            --max-time 30 || true

      - name: GET /health (control, sin CORS de por medio)
        run: |
          echo "---"
          curl -sS -i https://marcados-app.onrender.com/health --max-time 30 || true
