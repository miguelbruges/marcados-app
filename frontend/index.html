<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>MARCADOS</title>
<meta name="theme-color" content="#241329">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="banner-instalar" class="banner-instalar" hidden>
  <span id="banner-instalar-texto">Instalá MARCADOS en tu celular para abrirla más rápido, como una app.</span>
  <div class="banner-instalar-acciones">
    <button id="btn-instalar" type="button" hidden>Instalar</button>
    <button id="btn-instalar-cerrar" type="button" aria-label="Cerrar">✕</button>
  </div>
</div>
<header class="topbar">
  <span class="brand">MARCADOS</span>
  <div class="topbar-acciones">
    <button id="btn-alertas" class="btn-icono" type="button" title="Alertas" aria-label="Alertas" hidden>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c0.5-0.5 2-2 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/>
      </svg>
      <span id="badge-alertas" class="badge-notif" hidden>0</span>
    </button>
    <button id="btn-admin-gear" class="btn-icono" type="button" title="Administración" aria-label="Administración" hidden>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/>
        <line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2"/>
        <line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2"/>
      </svg>
    </button>
    <button id="btn-salir" class="link-btn" hidden>Salir</button>
  </div>
</header>

<main id="app" class="app"></main>

<nav id="tabbar" class="tabbar" hidden>
  <a href="#/panel" data-tab="panel">
    <span class="tab-ico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
    Panel
  </a>
  <a href="#/personas" data-tab="personas">
    <span class="tab-ico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.6.4 4.5 2.6 4.5 5.3"/></svg></span>
    Jóvenes
  </a>
  <a href="#/asistencia" data-tab="asistencia">
    <span class="tab-ico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8.5 15l2 2 4-4"/></svg></span>
    Asistencia
  </a>
  <a href="#/personas/nueva" data-tab="nueva">
    <span class="tab-ico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></span>
    Agregar
  </a>
</nav>

<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/matching-ui.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
