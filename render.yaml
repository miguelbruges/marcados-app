# Blueprint de Render (https://render.com/docs/blueprint-spec).
# En el dashboard de Render: New > Blueprint > conectar este repo > Apply.
#
# PLAN: 'free' A PROPÓSITO. NO lo subas a 'starter' sin que el usuario lo
# pida: no hay presupuesto para este proyecto, y un re-sync del blueprint
# con 'starter' puesto genera un cobro real.
#
# El arranque lento de la capa gratuita (30-60s) NO se resuelve acá: se
# resolvió mudando la app a Vercel, donde despertar tarda 1-3s y no cuesta
# nada (ver vercel.json y api/index.py). Este servicio de Render queda como
# respaldo mientras se confirma que Vercel anda bien.
#
# Un pinger externo tampoco sirvió: se probó entre 2026-09 y 2026-10 y el
# servicio se siguió durmiendo en pleno horario de uso.
services:
  - type: web
    name: marcados-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        # sync: false, NUNCA un 'value:' acá. Antes decía
        # 'value: sqlite:///./marcados.db', que es la base de juguete del
        # desarrollo local. La real es la connection string de Supabase y
        # vive solo en el dashboard (tiene contraseña: no va a git). Con un
        # 'value:' puesto, un re-sync del blueprint la pisaba con el sqlite
        # y la app arrancaba contra una base VACÍA, sin error visible: los
        # 120 jóvenes "desaparecían" hasta restaurar la variable a mano.
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # la URL de GitHub Pages, ej: https://tu-usuario.github.io
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false # email del primer usuario admin
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false # contraseña del primer usuario admin
      - key: TELEGRAM_BOT_TOKEN
        sync: false # opcional — bot de Telegram de solo consulta, token de @BotFather
